name: Deploy activity map to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - docs/activity-decisions/**
      - docs/decisions/**
      - docs/delivery/**
      - docs/security/**
      - docs/operations/**
      - docs/content/**
      - packages/soccer_agent_activity_package_20260908/docs/soccer_agent_activity_manifest.json
      - packages/soccer_agent_activity_package_20260908/docs/soccer_linear_manifest.json
      - site/activity-map/**
      - tools/build-activity-map.cjs
      - tools/validate-activity-map.cjs
      - .github/workflows/activity-map-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build activity map
        run: node tools/build-activity-map.cjs
      - name: Validate activity map
        run: node tools/validate-activity-map.cjs
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/activity-map/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
